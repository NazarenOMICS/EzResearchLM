[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ezresearchlm"
version = "0.2.0a1"
description = "NotebookLM-centered evidence pipeline for traceable academic research."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "lxml>=4.9",
  "PyPDF2>=3.0",
  "jsonschema>=4.23,<5"
]

[project.optional-dependencies]
legacy-planners = [
  "google-genai",
  "anthropic",
  "google-auth-oauthlib"
]
notebooklm = ["notebooklm-py==0.8.0"]

[project.scripts]
ez = "ez.cli:main"

[tool.setuptools]
package-dir = {"" = "packages/paper_search", "ez" = "packages/ez"}
py-modules = ["search_topic", "run_search_topic_wrapper"]
packages = ["paper_search_mcp", "paper_search_mcp.academic_platforms", "ez"]

[tool.setuptools.package-data]
ez = ["schemas/*.json"]

[tool.setuptools.data-files]
"share/ezresearchlm/scripts" = ["scripts/*.ps1", "scripts/run_external.py"]
"share/ezresearchlm/notebooklm/scripts" = ["notebooklm/scripts/*.py"]
"share/ezresearchlm/docs" = ["docs/ez-host-operator.md", "docs/ez-contracts.md", "docs/ez-user-guide.md"]
"share/ezresearchlm" = ["SETUP.md", "requirements.lock"]
