[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ezresearchlm"
version = "0.2.0a3"
description = "NotebookLM-centered evidence pipeline for traceable academic research."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "lxml>=4.9",
  "PyPDF2>=3.0",
  "jsonschema>=4.23,<5"
]

[project.optional-dependencies]
notebooklm = ["notebooklm-py==0.8.0"]
desktop = ["mcp>=1.2,<2"]

[project.scripts]
ez = "ez.cli:main"
ez-mcp = "ez.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "packages/paper_search", "ez" = "packages/ez"}
py-modules = ["search_topic"]
packages = ["paper_search_mcp", "paper_search_mcp.academic_platforms", "ez"]

[tool.setuptools.package-data]
ez = ["schemas/*.json"]

[tool.setuptools.data-files]
"share/ezresearchlm/docs" = ["docs/ez-host-operator.md", "docs/ez-contracts.md", "docs/ez-user-guide.md"]
"share/ezresearchlm" = ["SETUP.md", "requirements.lock"]
